<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — Atelier Création de Parfum | Kitoko Ladies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    :root {
      --burgundy: #3D0C1E;
      --burgundy-light: #56162D;
      --burgundy-tint: #F7F1F3;
      --cream: #FAF8F5;
      --white: #FFFFFF;
      --ink: #191516;
      --muted: #5C5255;
      --border: #E4DCD8;
      --error: #B91C1C;
      --error-bg: #FEF2F2;
      --success: #166534;
      --shadow: 0 18px 45px rgba(61, 12, 30, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Barre supérieure */
    .top-banner {
      background-color: var(--burgundy);
      color: var(--white);
      text-align: center;
      padding: 10px 16px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* Conteneur principal responsive */
    .page-wrapper {
      max-width: 1120px;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 32px) 64px;
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(24px, 4vw, 44px);
      align-items: start;
    }

    @media (min-width: 920px) {
      .page-wrapper {
        grid-template-columns: 0.95fr 1.05fr;
      }
      .poster-column {
        position: sticky;
        top: 28px;
      }
    }

    /* Carte Affiche Éditoriale (Colonne Gauche) */
    .poster-card {
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: clamp(28px, 5vw, 48px) clamp(22px, 4vw, 40px);
      text-align: center;
      position: relative;
    }

    .poster-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(61, 12, 30, 0.14);
      pointer-events: none;
    }

    .brand-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--burgundy);
      margin-bottom: 18px;
    }
